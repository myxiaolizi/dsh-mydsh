# dsh-mydsh: one row mounting the plugin.
#
# The Host half registers the /api/mydsh routes and owns every engine; the
# `dsh.client` declaration in package.json makes the web app load ./client.js as
# the browser half. Nothing here changes another plugin's configuration: the
# interface switches, retry policy and prompt text live in this plugin's own
# settings document under <DSH_HOME>/dsh-mydsh, so a reinstall or an upgrade
# never rewrites the user's patch layer.
- insert:
    - id: dsh-mydsh
      name: 'dsh-mydsh'
